name: Build Free Look .hmod

on:
  push:
    branches: [arena/61cb5fd4-free-look]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable + wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install component verification tools
        run: npm ci

      # tools/build.sh runs, in order:
      #   cargo test -p free-look-logic        (pure state-machine unit tests)
      #   cargo build --target wasm32-unknown-unknown --release
      #   ComponentEncoder                     (core module -> WASM component)
      #   tools/verify.mjs                     (imports/exports/API level/no WASI)
      #   tools/test-host.mjs                  (mock-host behaviour checks)
      #   tools/package.py                     (free_look.hmod ZIP + SHA-256)
      - name: Build, verify and package
        run: bash tools/build.sh

      - name: Upload ready-to-install .hmod
        uses: actions/upload-artifact@v4
        with:
          name: free-look-hmod
          if-no-files-found: error
          retention-days: 90
          path: |
            free_look.hmod
            mod.wasm
            SHA256SUMS.txt

      - name: Attach the .hmod to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            free_look.hmod
            SHA256SUMS.txt
          body: |
            Free Look for Horizon (sandboxed `.hmod`).

            Read README.md and docs/API-LIMITATIONS.md first: Horizon's `.hmod`
            API has no camera-angle setter and no way to consume F5, so this
            package provides the settings, key handling and state machine, and
            reports in game that camera control needs a native API.
